<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UNO">
<title>UNO — Road Trip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  color-scheme: dark;
  --bg:#131312;
  --surface-1:#1a1a19;
  --surface-2:#24241f;
  --surface-3:#2f2f2a;
  --border:#383835;
  --border-soft:#2a2a26;
  --text-primary:#ffffff;
  --text-secondary:#c3c2b7;
  --text-muted:#8a8981;
  --accent:#3987e5;
  --good:#0ca30c;
  --critical:#d03b3b;
  --radius:14px;
  --tabbar-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text-primary);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(19,19,18,.92);
  backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border-soft);
  padding-top:env(safe-area-inset-top);
}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px}
.brand span{display:block;font-weight:500;letter-spacing:.06em;font-size:10px;color:var(--text-muted);text-transform:uppercase}
.pill{
  font-size:12px;padding:6px 11px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);
  display:flex;align-items:center;gap:7px;
}
.pill.live{border-color:#1f5c33;background:#12291a;color:#7fdca0}
.syncdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--text-muted)}
.syncdot.live{background:var(--good);box-shadow:0 0 0 2px rgba(12,163,12,.2)}
.syncdot.connecting{background:#eda100}
.syncdot.offline{background:var(--critical)}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(19,19,18,.95);
  backdrop-filter:saturate(140%) blur(12px);
  border-top:1px solid var(--border-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .wrap{display:flex;height:var(--tabbar-h)}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-muted);font-size:10.5px;letter-spacing:.03em;font-weight:600;
}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--text-primary)}
.tabbar button.on svg{stroke:var(--accent)}

/* ---------- generic ---------- */
main{padding-top:16px}
.card{background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden}
.card + .card{margin-top:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin:22px 0 9px;font-weight:700}
h2:first-child{margin-top:0}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}
.tnum{font-variant-numeric:tabular-nums}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:16px;border-radius:var(--radius);font-weight:700;font-size:16px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-primary);
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{padding:20px;font-size:18px}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text-secondary);padding:13px;font-size:14px}
.btn.danger{color:#ef8b8b;border-color:#4a2727;background:#241717}
.btn[disabled]{opacity:.4}
.row2{display:flex;gap:10px}
.row2 > *{flex:1}
.empty{text-align:center;padding:40px 22px;color:var(--text-muted);font-size:14px}
.empty .big{font-size:34px;margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* ---------- leaderboard ---------- */
.lb-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border-soft)}
.lb-row:last-child{border-bottom:none}
.lb-row.first{background:linear-gradient(90deg,rgba(57,135,229,.14),transparent 70%)}
.rank{width:20px;text-align:center;font-size:13px;font-weight:800;color:var(--text-muted)}
.lb-row.first .rank{color:#f0c14b}
.lb-name{font-weight:650;font-size:16px}
.lb-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.lb-total{margin-left:auto;text-align:right}
.lb-total b{font-size:22px;font-weight:750;letter-spacing:-.02em}
.lb-total .d{font-size:11px;color:var(--text-muted);margin-top:1px}
.hdrnote{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border-soft);letter-spacing:.03em}

/* ---------- circle ---------- */
.circle{position:relative;width:100%;max-width:330px;margin:6px auto 0;aspect-ratio:1}
.circle .hubtxt{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-size:11px;color:var(--text-muted);pointer-events:none;padding:0 66px;line-height:1.45
}
.seat{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;
}
.seat .av{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;letter-spacing:.02em;border:2px solid var(--border);background:var(--surface-2);color:var(--text-muted)
}
.seat.filled .av{color:#fff}
.seat .nm{font-size:11px;color:var(--text-secondary);text-align:center;line-height:1.15;max-width:74px}
.seat.starter .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #f0c14b}
.seat .badge{font-size:9px;font-weight:800;color:#f0c14b;letter-spacing:.07em}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.chip{
  display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);font-size:14px;font-weight:600
}
.chip.off{opacity:.32}

/* ---------- game entry ---------- */
.gp-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-soft)}
.gp-row:last-child{border-bottom:none}
.gp-row.win{background:rgba(12,163,12,.09)}
.gp-name{font-weight:650;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp-name .st{font-size:9px;font-weight:800;color:#f0c14b;letter-spacing:.06em;display:block}
.gp-ctl{margin-left:auto;display:flex;align-items:center;gap:6px}
.wbtn{
  width:42px;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1
}
.wbtn.on{background:var(--good);border-color:var(--good)}
.wbtn.cut.on{background:#0a7d0a;border-color:#0a7d0a}
.pts{
  width:74px;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
  text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;padding:0
}
.pts:focus{outline:none;border-color:var(--accent);background:#101922}
.pts.locked{background:transparent;border-color:transparent;color:var(--good);font-weight:800}

/* ---------- misc ---------- */
.gm{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border-soft);width:100%;text-align:left}
.gm:last-child{border-bottom:none}
.gm .idx{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--text-muted);flex:none}
.gm .t{font-size:14px;font-weight:600}
.gm .s{font-size:11.5px;color:var(--text-muted);margin-top:1px}
.gm .chev{margin-left:auto;color:var(--text-muted);font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius);padding:13px 12px}
.kpi .v{font-size:21px;font-weight:750;letter-spacing:-.02em}
.kpi .l{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(14px);
  background:var(--surface-3);border:1px solid var(--border);border-radius:12px;
  padding:12px 17px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;max-width:92vw;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bonus{background:#1d2a17;border-color:#3d6b2a;color:#c9f0a8}
.note{font-size:12px;color:var(--text-muted);line-height:1.5;padding:0 2px;margin-top:9px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- chart ---------- */
.chartbox{padding:12px 8px 4px}
#chartsvg{display:block;width:100%;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 13px;border-top:1px solid var(--border-soft)}
.lg{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:600}
.lg.dim{opacity:.34}
.scrub{border-top:1px solid var(--border-soft);padding:11px 14px 13px}
.scrub .hd{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.scrub .r{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.scrub .r b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.scrub .r .gap{width:52px;text-align:right;color:var(--text-muted);font-size:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th,table.tbl td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums}
table.tbl th{color:var(--text-muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.banner{display:block;width:100%;text-align:left;padding:11px 13px;border-radius:11px;font-size:13px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);margin-bottom:12px}
.banner.warn{background:#2a2312;border-color:#5c4a1f;color:#f0d79a}
.urlin{width:100%;margin-top:12px;padding:13px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-2);font-size:14px}
.urlin:focus{outline:none;border-color:var(--accent)}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">UNO<span>Road trip league</span></div>
    <div id="statuspill"></div>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabbar"><div class="wrap">
  <button data-tab="board"><svg viewBox="0 0 24 24"><path d="M8 21V9M16 21V4M3 21h18M3 21V14"/></svg>Leaderboard</button>
  <button data-tab="session"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="3.4" r="1.6"/><circle cx="19.6" cy="12" r="1.6"/><circle cx="4.4" cy="12" r="1.6"/></svg>Session</button>
  <button data-tab="chart"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg>Chart</button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Data</button>
</div></nav>

<div class="toast" id="toast"></div>

<script src="history.js"></script>
<script>
"use strict";
/* ============================ constants ============================ */
var THIS_YEAR = 2026;
var PLAYERS = [
  { id:"andy",    name:"Andy",    born:1999, color:"#3987e5" },
  { id:"justin",  name:"Justin",  born:2001, color:"#d95926" },
  { id:"julia",   name:"Julia",   born:2002, color:"#199e70" },
  { id:"nathan",  name:"Nathan",  born:2002, color:"#c98500" },
  { id:"tom",     name:"Tom",     born:2003, color:"#d55181" },
  { id:"louna",   name:"Louna",   born:2002, color:"#008300" },
  { id:"nicolas", name:"Nicolas", born:1999, color:"#9085e9" }
];
var P = {};
PLAYERS.forEach(function(p){ p.age = THIS_YEAR - p.born; p.yearBonus = -10 * p.age; P[p.id] = p; });
var IDS = PLAYERS.map(function(p){ return p.id; });
var STORE = "uno-roadtrip-v1";
var APP_VERSION = "2026-08-20j";

/* ============================ state ============================ */
var lastSaved = null;      /* must precede load(), which fills it in */
var state = load();
var ui = { tab:"board", editing:null, draftSeat:null, hidden:{}, scrub:null, openSession:null };

function blank(){ return { version:2, sessions:[], opening:{}, seeded:false, tombs:{} }; }

/* ---------------------------------------------------------------------------
   Storage is a flat set of records — one per session, one per game — even
   though the screens work with a nested structure. That is what makes several
   phones safe: two people entering different games touch different records, so
   neither can overwrite the other. Merging is a union by id, and the only time
   anything is discarded is when the SAME record was edited in two places, where
   the later edit wins.
   --------------------------------------------------------------------------- */
function toRecords(st){
  var r = { sessions:{}, games:{}, opening: st.opening || {} };
  st.sessions.forEach(function(sess, si){
    r.sessions[sess.id] = {
      id:sess.id, ord: sess.ord != null ? sess.ord : si + 1,
      startedAt:sess.startedAt || null, endedAt:sess.endedAt || null,
      seating:sess.seating || null, imported:!!sess.imported,
      updatedAt:sess.updatedAt || 0
    };
    sess.games.forEach(function(g, gi){
      r.games[g.id] = {
        id:g.id, sessionId:sess.id, ord: g.ord != null ? g.ord : gi + 1,
        startedAt:g.startedAt || null, endedAt:g.endedAt || null,
        starter:g.starter || null, entries:g.entries,
        imported:!!g.imported, updatedAt:g.updatedAt || 0
      };
    });
  });
  Object.keys(st.tombs || {}).forEach(function(id){
    var t = st.tombs[id];
    (t.kind === "session" ? r.sessions : r.games)[id] = { id:id, deleted:true, updatedAt:t.at };
  });
  return r;
}
function fromRecords(r, prev){
  var live = {};
  (prev && prev.sessions || []).forEach(function(s){ if(s.live) live[s.id] = s.live; });
  var tombs = {};
  var byOrd = function(a,b){ return (a.ord - b.ord) || (a.id < b.id ? -1 : 1); };
  var vals = function(o, kind){
    return Object.keys(o || {}).map(function(k){
      var v = o[k]; v.id = v.id || k;
      if(v.deleted) tombs[v.id] = { kind:kind, at:v.updatedAt || 0 };
      return v;
    }).filter(function(v){ return !v.deleted; });
  };
  var sessions = vals(r.sessions, "session").sort(byOrd);
  var index = {};
  sessions.forEach(function(sess){
    sess.games = [];
    if(live[sess.id]) sess.live = live[sess.id];
    index[sess.id] = sess;
  });
  vals(r.games, "game").sort(byOrd).forEach(function(g){
    if(index[g.sessionId]) index[g.sessionId].games.push(g);
  });
  return { version:2, opening:r.opening || {}, sessions:sessions, seeded:true, tombs:tombs };
}

function load(){ return adopt(loadStored()); }
function loadStored(){
  try {
    var raw = localStorage.getItem(STORE);
    if(!raw) return blank();
    var s = JSON.parse(raw);
    if(!s) return blank();
    if(s.records) return fromRecords(s.records, null);
    if(!Array.isArray(s.sessions)) return blank();
    if(!s.opening) s.opening = {};        /* a v1 save from before sync existed */
    if(!s.tombs) s.tombs = {};
    return s;
  } catch(e){ return blank(); }
}
/* What is on disk is also what was last sent, so a plain reload must not make
   every record look freshly edited. */
function adopt(st){
  lastSaved = JSON.parse(JSON.stringify(toRecords(st)));
  return st;
}

/* Records whose contents changed since the last save get a fresh timestamp;
   that timestamp is what settles a genuine two-phone conflict.
   (lastSaved is declared above load(), which populates it.) */
function stampChanges(recs){
  var now = Date.now(), changed = { sessions:{}, games:{} };
  ["sessions","games"].forEach(function(kind){
    Object.keys(recs[kind]).forEach(function(id){
      var rec = recs[kind][id], was = lastSaved && lastSaved[kind][id];
      var a = JSON.stringify(withoutStamp(rec)), b = was ? JSON.stringify(withoutStamp(was)) : null;
      if(a !== b){
        /* a record that arrived with its own timestamp (the imported history)
           keeps it; anything genuinely edited here is stamped now */
        if(was || !rec.updatedAt) rec.updatedAt = now;
        changed[kind][id] = rec;
      }
      else rec.updatedAt = was.updatedAt;
    });
  });
  if(!lastSaved || JSON.stringify(recs.opening) !== JSON.stringify(lastSaved.opening)) changed.opening = recs.opening;
  return changed;
}
function withoutStamp(rec){ var c = {}; for(var k in rec) if(k !== "updatedAt") c[k] = rec[k]; return c; }

function save(){
  var recs = toRecords(state);
  var changed = stampChanges(recs);
  applyStamps(recs);
  try { localStorage.setItem(STORE, JSON.stringify({ version:2, records:recs })); }
  catch(e){ toast("Couldn't save — phone storage is full"); }
  lastSaved = JSON.parse(JSON.stringify(recs));
  Sync.push(changed);
}
/* copy the fresh timestamps back onto the objects the screens are holding */
function applyStamps(recs){
  state.sessions.forEach(function(sess){
    var sr = recs.sessions[sess.id]; if(sr) sess.updatedAt = sr.updatedAt;
    sess.games.forEach(function(g){ var gr = recs.games[g.id]; if(gr) g.updatedAt = gr.updatedAt; });
  });
}

/* Merge records arriving from another phone. Union by id; on the same record,
   the later edit wins. */
function mergeRemote(remote){
  if(!remote) return false;
  var mine = toRecords(state), touched = false;
  ["sessions","games"].forEach(function(kind){
    Object.keys(remote[kind] || {}).forEach(function(id){
      var theirs = remote[kind][id], ours = mine[kind][id];
      theirs.id = theirs.id || id;
      if(!ours || (theirs.updatedAt || 0) > (ours.updatedAt || 0)){
        mine[kind][id] = theirs; touched = true;
      }
    });
  });
  if(remote.opening && !Object.keys(mine.opening || {}).length && Object.keys(remote.opening).length){
    mine.opening = remote.opening; touched = true;
  }
  if(!touched) return false;
  state = fromRecords(mine, state);
  lastSaved = JSON.parse(JSON.stringify(toRecords(state)));
  try { localStorage.setItem(STORE, JSON.stringify({ version:2, records:lastSaved })); } catch(e){}
  return true;
}
function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }
function sessionById(id){
  for(var i=0;i<state.sessions.length;i++) if(state.sessions[i].id === id) return state.sessions[i];
  return null;
}
/* An edit can belong to the running session or to one being looked back at. */
function editSession(){
  if(ui.editing && ui.editing.sessionId) return sessionById(ui.editing.sessionId);
  return curSession();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function curSession(){
  var s = state.sessions[state.sessions.length-1];
  return (s && !s.endedAt) ? s : null;
}

/* ============================ live sync ============================ */
/* Every phone talks to one shared league. Writes go up as individual records,
   so two people scoring at the same time cannot clobber each other. Reads come
   down over a live stream, with a slow poll as a safety net for flaky signal.
   With no connection the app carries on exactly as before and everything
   queued goes up when the signal returns. */
var HISTORY_STAMP = 1;   /* older than any real edit, on every phone */
var SYNC_KEY = "uno-sync-url";
var Sync = {
  url: null,
  state: "off",            /* off | connecting | live | offline */
  pending: null,
  es: null,
  timer: null,

  configured: function(){ return !!Sync.url; },

  init: function(){
    /* ?league=… lets one shared link set every phone up in a single tap */
    var m = location.search.match(/[?&]league=([^&]*)/);
    if(m && m[1]){
      try {
        localStorage.setItem(SYNC_KEY, decodeURIComponent(m[1]).replace(/\/+$/, ""));
        history.replaceState(null, "", location.pathname);
      } catch(e){}
    }
    Sync.url = (localStorage.getItem(SYNC_KEY) || (window.UNO_SYNC_URL || "")).replace(/\/+$/, "") || null;
    try { Sync.pending = JSON.parse(localStorage.getItem("uno-sync-pending") || "null"); } catch(e){}
    if(Sync.url) Sync.connect();
  },

  /* Accepts the database address or a full invite link, tidies both. */
  normalise: function(raw){
    var v = (raw || "").trim();
    if(!v) return "";
    var m = v.match(/[?&]league=([^&\s]+)/);
    if(m) { try { v = decodeURIComponent(m[1]); } catch(e){ v = m[1]; } }
    v = v.trim().replace(/\/+$/, "");
    if(v && !/^https?:\/\//i.test(v)) v = "https://" + v;
    return v;
  },
  looksValid: function(v){ return /^https?:\/\/[^\s/]+\.[^\s/]+/i.test(v); },

  setUrl: function(url){
    url = Sync.normalise(url);
    if(url) localStorage.setItem(SYNC_KEY, url); else localStorage.removeItem(SYNC_KEY);
    Sync.stop();
    Sync.url = url || null;
    if(Sync.url){ Sync.push(toRecords(state)); Sync.connect(); }
    else { Sync.state = "off"; render(); }
  },

  stop: function(){
    if(Sync.es){ Sync.es.close(); Sync.es = null; }
    if(Sync.timer){ clearInterval(Sync.timer); Sync.timer = null; }
  },

  connect: function(){
    if(!Sync.url) return;
    Sync.setState("connecting");
    Sync.pull();
    try {
      Sync.es = new EventSource(Sync.url + ".json");
      Sync.es.onopen = function(){ Sync.setState("live"); Sync.flush(); };
      Sync.es.onmessage = function(){ Sync.pull(); };
      Sync.es.addEventListener("put", function(){ Sync.pull(); });
      Sync.es.addEventListener("patch", function(){ Sync.pull(); });
      Sync.es.onerror = function(){ Sync.setState("offline"); };
    } catch(e){ Sync.setState("offline"); }
    Sync.timer = setInterval(function(){ Sync.pull(); Sync.flush(); }, 45000);
  },

  setState: function(st){
    if(Sync.state === st) return;
    Sync.state = st;
    var el = document.getElementById("syncpill");
    if(el) el.className = "syncdot " + st;
  },

  pull: function(){
    if(!Sync.url) return Promise.resolve();
    return fetch(Sync.url + ".json", { cache:"no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        Sync.setState("live");
        if(data && mergeRemote(data) && !ui.editing) render();
      })
      .catch(function(){ Sync.setState("offline"); });
  },

  /* Queue first, send second: nothing is lost if the send fails. */
  push: function(changed){
    if(!Sync.url || !changed) return;
    var any = Object.keys(changed.sessions || {}).length
            + Object.keys(changed.games || {}).length
            + (changed.opening ? 1 : 0);
    if(!any) return;
    Sync.pending = Sync.pending || { sessions:{}, games:{} };
    Object.keys(changed.sessions || {}).forEach(function(k){ Sync.pending.sessions[k] = changed.sessions[k]; });
    Object.keys(changed.games || {}).forEach(function(k){ Sync.pending.games[k] = changed.games[k]; });
    if(changed.opening) Sync.pending.opening = changed.opening;
    Sync.savePending();
    Sync.flush();
  },

  savePending: function(){
    try {
      if(Sync.pending) localStorage.setItem("uno-sync-pending", JSON.stringify(Sync.pending));
      else localStorage.removeItem("uno-sync-pending");
    } catch(e){}
  },

  flush: function(){
    if(!Sync.url || !Sync.pending || Sync.sending) return;
    var batch = Sync.pending;
    Sync.pending = null;            /* anything saved from here on queues afresh */
    Sync.savePending();
    Sync.sending = true;
    var jobs = [];
    if(Object.keys(batch.sessions || {}).length) jobs.push(Sync.patch("/sessions", batch.sessions));
    if(Object.keys(batch.games || {}).length)    jobs.push(Sync.patch("/games", batch.games));
    if(batch.opening)                            jobs.push(Sync.patch("/opening", batch.opening));
    Promise.all(jobs).then(function(){
      Sync.sending = false;
      Sync.setState("live");
      if(Sync.pending) Sync.flush();      /* saved while that one was in the air */
    }).catch(function(){
      Sync.sending = false;
      Sync.requeue(batch);
      Sync.setState("offline");
    });
  },

  /* Put a failed batch back, without displacing anything newer. */
  requeue: function(batch){
    var q = Sync.pending || { sessions:{}, games:{} };
    ["sessions","games"].forEach(function(kind){
      Object.keys(batch[kind] || {}).forEach(function(id){
        if(!q[kind][id]) q[kind][id] = batch[kind][id];
      });
    });
    if(batch.opening && !q.opening) q.opening = batch.opening;
    Sync.pending = q;
    Sync.savePending();
  },

  patch: function(path, body){
    return fetch(Sync.url + path + ".json", {
      method:"PATCH", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body)
    }).then(function(r){ if(!r.ok) throw new Error(r.status); });
  }
};
window.addEventListener("online", function(){ if(Sync.url){ Sync.pull(); Sync.flush(); } });

/* ============================ scoring ============================ */
/* Replays every game from the start, so edits and deletions always
   recompute correctly. Bonuses fire on an EXACT landing only, and are
   evaluated once per game (no chain reactions). */
function compute(){
  var totals = {}, games = {}, wins = {}, cuts = {}, worst = {}, best = {};
  var opening = state.opening || {};
  IDS.forEach(function(id){ totals[id]=opening[id]||0; games[id]=0; wins[id]=0; cuts[id]=0; worst[id]=null; best[id]=null; });

  var snaps = [{ label:"Start", at:null, totals:copy(totals) }];
  var flat = [], joined = {};

  state.sessions.forEach(function(sess, si){
    sess.games.forEach(function(g, gi){
      var events = [];
      IDS.forEach(function(id){
        var e = g.entries[id];
        if(!e) return;
        var base = e.kind === "win" ? -10 : e.kind === "cut" ? -20 : (e.points || 0);
        var mid = totals[id] + base;
        var bonus = 0, tags = [];
        if(mid > 0 && mid % 200 === 0){ bonus += -200; tags.push("200"); }
        if(mid === P[id].born){ bonus += P[id].yearBonus; tags.push("year"); }
        totals[id] = mid + bonus;
        games[id]++;
        if(e.kind === "win" || e.kind === "cut"){ wins[id]++; if(e.kind==="cut") cuts[id]++; }
        if(worst[id] === null || base > worst[id]) worst[id] = base;
        if(best[id] === null || base < best[id]) best[id] = base;
        if(joined[id] === undefined) joined[id] = flat.length;
        if(tags.length) events.push({ id:id, tags:tags, landed:mid, bonus:bonus });
      });
      flat.push({ sess:sess, game:g, si:si, gi:gi, no:flat.length+1, bonuses:events });
      snaps.push({ label:"Game " + flat.length, at:g.startedAt, totals:copy(totals), no:flat.length });
    });
  });

  var stats = IDS.map(function(id){
    return {
      id:id, total:totals[id], games:games[id], wins:wins[id], cuts:cuts[id],
      worst:worst[id], best:best[id],
      opening: opening[id] || 0,
      avg: games[id] ? (totals[id] - (opening[id]||0))/games[id] : null
    };
  }).sort(function(a,b){ return a.total - b.total || a.id.localeCompare(b.id); });

  return { totals:totals, stats:stats, snaps:snaps, flat:flat, joined:joined };
}
function copy(o){ var r={}; for(var k in o) r[k]=o[k]; return r; }

/* Who starts: whoever is last right now, i.e. carrying the highest total.
   Ties resolve by seat order. */
function suggestStarter(seating, totals){
  var order = (seating && seating.length >= 2) ? seating : IDS;
  var worstId = null;
  order.forEach(function(id){ if(worstId === null || totals[id] > totals[worstId]) worstId = id; });
  return worstId;
}

/* ============================ helpers ============================ */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function sgn(n){ return (n > 0 ? "+" : "") + n; }
function initials(n){ return n.slice(0,3).toUpperCase(); }
function fmtTime(ts){ if(!ts) return ""; var d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtDay(ts){
  if(!ts) return "";
  var d = new Date(ts);
  return d.toLocaleDateString(undefined,{ weekday:"short", day:"numeric", month:"short" });
}
function dur(ms){
  var s = Math.max(0, Math.round(ms/1000));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
var toastTimer;
function toast(msg, kind){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = "toast" + (kind ? " " + kind : ""); }, kind === "bonus" ? 4200 : 2400);
}
function dotHTML(id){ return '<span class="dot" style="background:'+P[id].color+'"></span>'; }

/* ============================ render ============================ */
function render(){
  document.querySelectorAll(".tabbar button").forEach(function(b){
    b.classList.toggle("on", b.dataset.tab === ui.tab);
  });
  var c = compute();
  var sess = curSession();

  var pill = document.getElementById("statuspill");
  var syncMark = '<span class="syncdot '+(Sync.configured()?Sync.state:"off")+'" id="syncpill"></span>';
  if(sess && sess.live){
    pill.innerHTML = '<div class="pill live">'+syncMark+'<span class="dotlive"></span><span class="timer" id="livetimer">0:00</span></div>';
  } else if(ui.editing){
    pill.innerHTML = '<div class="pill">'+syncMark+'Editing</div>';
  } else if(sess){
    pill.innerHTML = '<div class="pill">'+syncMark+'Session · '+sess.games.length+' game'+(sess.games.length===1?"":"s")+'</div>';
  } else {
    pill.innerHTML = '<div class="pill">'+syncMark+c.flat.length+' games total</div>';
  }

  var v = document.getElementById("view");
  if(ui.tab === "board") v.innerHTML = viewBoard(c);
  else if(ui.tab === "session") v.innerHTML = viewSession(c, sess);
  else if(ui.tab === "chart") v.innerHTML = viewChart(c);
  else v.innerHTML = viewData(c);

  if(ui.tab === "chart") drawCharts(c);
  tickTimer();
}

/* ---------- leaderboard ---------- */
function viewBoard(c){
  if(!c.flat.length){
    return '<div class="card"><div class="empty"><div class="big">🃏</div>'
      + '<b style="color:var(--text-secondary);display:block;margin-bottom:6px">No games yet</b>'
      + 'Go to <b>Session</b>, seat everyone in the circle, and play the first hand.</div></div>';
  }
  var rows = c.stats.map(function(s, i){
    var p = P[s.id];
    var sub = s.games + " games · " + s.wins + " win" + (s.wins===1?"":"s")
      + (s.cuts ? " (" + s.cuts + " cut)" : "")
      + " · avg " + (s.avg === null ? "–" : (Math.round(s.avg*10)/10));
    return '<div class="lb-row'+(i===0?" first":"")+'">'
      + '<div class="rank">'+(i===0?"👑":(i+1))+'</div>'
      + dotHTML(s.id)
      + '<div style="min-width:0"><div class="lb-name">'+esc(p.name)+'</div><div class="lb-sub">'+sub+'</div></div>'
      + '<div class="lb-total"><b class="tnum">'+s.total+'</b><div class="d">'+(function(g){ return g.d+' → '+g.t; })(nextTarget(s.total, P[s.id].born))+'</div></div>'
      + '</div>';
  }).join("");

  var lead = c.stats[0], last = c.stats[c.stats.length-1];
  return '<div class="card">'
    + '<div class="hdrnote"><span>LOWEST SCORE WINS</span><span>POINTS TO NEXT BONUS</span></div>'
    + rows + '</div>'
    + '<div class="note">The small grey number is the next bonus: how far that player is from'
    + ' landing <b>exactly</b> on a multiple of 200, or exactly on their birth year.</div>'
    + '<h2>Right now</h2>'
    + '<div class="kpis">'
    + kpi(lead.total, esc(P[lead.id].name)+" leads")
    + kpi(last.total - lead.total, "Spread 1st→7th")
    + kpi(c.flat.length, "Games logged")
    + '</div>';
}
function nextTarget(total, born){
  var t200 = total < 0 ? 200 : (Math.floor(total/200) + 1) * 200;
  var best = { t:t200, d:t200 - total };
  if(born - total > 0 && born - total < best.d) best = { t:born, d:born - total };
  return best;
}
function kpi(v,l){ return '<div class="kpi"><div class="v tnum">'+v+'</div><div class="l">'+l+'</div></div>'; }

/* ---------- session ---------- */
/* Silently not sharing is the worst way for this to fail, so say it where the
   scoring happens rather than only on the Data tab. */
function syncBanner(){
  if(!Sync.configured())
    return '<button class="banner warn" data-act="go-sync">Not sharing \u2014 these scores stay on this phone.'
         + ' <b>Set it up \u203a</b></button>';
  var q = Sync.pending
    ? Object.keys(Sync.pending.games||{}).length + Object.keys(Sync.pending.sessions||{}).length : 0;
  if(Sync.state === "offline")
    return '<div class="banner">No signal'+(q?' \u00b7 '+plural(q,"change")+' waiting to send':'')
         + ' \u2014 keep scoring, it will catch up.</div>';
  return '';
}

function viewSession(c, sess){
  if(ui.editing) return viewGameEntry(c, editSession() || sess);
  if(ui.openSession){
    var opened = sessionById(ui.openSession);
    if(opened) return viewPastSession(c, opened);
    ui.openSession = null;
  }

  if(!sess){
    var past = state.sessions.slice().reverse().map(function(s){
      var n = state.sessions.indexOf(s) + 1;
      return '<button class="gm" data-act="open-session" data-s="'+s.id+'"><div class="idx">'+n+'</div>'
        + '<div><div class="t">'+(s.startedAt ? fmtDay(s.startedAt)+' · '+fmtTime(s.startedAt) : 'Date not recorded')+'</div>'
        + '<div class="s">'+plural(s.games.length,"game")+' · '+plural(s.seating?s.seating.length:0,"player")+'</div></div>'
        + '<div class="chev">›</div></button>';
    }).join("");
    return syncBanner() + '<div class="card"><div class="empty"><div class="big">🎬</div>'
      + '<b style="color:var(--text-secondary);display:block;margin-bottom:6px">No session running</b>'
      + 'Start one when everyone sits down.</div></div>'
      + '<div style="margin-top:12px"></div>'
      + '<button class="btn primary big" data-act="new-session">Start new session</button>'
      + (past ? '<h2>Past sessions</h2><div class="card">'+past+'</div>' : "");
  }

  if(!sess.seating || sess.seating.length < 2) return viewSeating(sess);

  var starter = suggestStarter(sess.seating, c.totals);
  var games = gamesListHTML(sess);

  return syncBanner() + '<div class="card" style="padding:14px 12px 18px">'
    + circleHTML(sess.seating, starter)
    + '</div>'
    + '<div style="margin-top:12px"></div>'
    + (sess.live
        ? '<button class="btn primary big" data-act="open-live">Enter results →</button>'
        : '<button class="btn primary big" data-act="start-game">Start game '+(sess.games.length+1)+'</button>')
    + '<div class="row2" style="margin-top:10px">'
    + '<button class="btn ghost" data-act="reseat">Change seats</button>'
    + '<button class="btn ghost" data-act="end-session">End session</button>'
    + '</div>'
    + (games ? '<h2>This session ('+sess.games.length+')</h2><div class="card">'+games+'</div>' : '<div class="note">Nothing played yet this session.</div>');
}

/* The average score of a game: the mean of what everyone at the table took,
   the winner's -10 or -20 included. Bonuses are not part of it - they are not
   points off a hand. Divided by however many actually played. */
function baseScore(e){ return e.kind === "win" ? -10 : e.kind === "cut" ? -20 : (e.points || 0); }
function gameAverage(g){
  var ids = Object.keys(g.entries || {});
  if(!ids.length) return null;
  var sum = ids.reduce(function(a,id){ return a + baseScore(g.entries[id]); }, 0);
  return sum / ids.length;
}
function fmtAvg(v){ return v === null ? "–" : (Math.round(v*10)/10); }

function gamesListHTML(sess){
  return sess.games.slice().reverse().map(function(g){
    var n = sess.games.indexOf(g) + 1;
    var wid = winnerOf(g);
    var cut = wid && g.entries[wid].kind === "cut";
    var high = IDS.reduce(function(a,id){
      var e = g.entries[id]; if(!e || e.kind !== "points") return a;
      return (!a || e.points > a.points) ? { id:id, points:e.points } : a;
    }, null);
    return '<button class="gm" data-act="edit-game" data-g="'+g.id+'">'
      + '<div class="idx">'+n+'</div>'
      + '<div><div class="t">'+(wid ? esc(P[wid].name)+" won"+(cut?" ✂️":"") : "No winner")+'</div>'
      + '<div class="s">'+fmtTime(g.startedAt)+' · avg '+fmtAvg(gameAverage(g))
      + (high?' · '+esc(P[high.id].name)+' took '+high.points:'')+'</div></div>'
      + '<div class="chev">›</div></button>';
  }).join("");
}

/* Looking back at a finished session: what happened, and the way to remove it. */
function viewPastSession(c, sess){
  var n = state.sessions.indexOf(sess) + 1;
  var when = sess.startedAt
    ? fmtDay(sess.startedAt) + ' · ' + fmtTime(sess.startedAt)
      + (sess.endedAt && fmtTime(sess.endedAt) !== fmtTime(sess.startedAt) ? '–' + fmtTime(sess.endedAt) : '')
    : 'Date not recorded';
  return '<button class="btn ghost" data-act="close-session" style="margin-bottom:14px">‹ All sessions</button>'
    + '<h2>Session '+n+(sess.imported ? ' · from the spreadsheet' : '')+'</h2>'
    + '<div class="card" style="padding:14px 12px 16px">'
    + '<div style="text-align:center;font-weight:700;font-size:16px">'+when+'</div>'
    + '<div style="text-align:center" class="note">'+plural(sess.games.length,"game")
    + ' · '+plural(sess.seating ? sess.seating.length : 0,"player")
    + (sess.games.length ? ' · avg ' + fmtAvg(sess.games.reduce(function(a,g){ return a + gameAverage(g); },0)/sess.games.length) : '')
    + '</div>'
    + (sess.seating ? circleHTML(sess.seating, null) : '')
    + '</div>'
    + (sess.games.length
        ? '<h2>Games</h2><div class="card">'+gamesListHTML(sess)+'</div>'
        : '<div class="note">No games were recorded in this session.</div>')
    + '<h2>Remove it</h2>'
    + '<button class="btn ghost danger" data-act="delete-session">Delete this whole session</button>'
    + '<div class="note">This removes '+plural(sess.games.length,"game")
    + ' from the league on every phone, and everyone\'s totals are worked out again without them.</div>';
}

function winnerOf(g){
  for(var i=0;i<IDS.length;i++){
    var e = g.entries[IDS[i]];
    if(e && (e.kind === "win" || e.kind === "cut")) return IDS[i];
  }
  return null;
}

function circleHTML(seating, starter){
  var n = seating.length;
  var seats = seating.map(function(id, i){
    var a = (-90 + i * (360/n)) * Math.PI/180;
    var x = 50 + 38 * Math.cos(a), y = 50 + 38 * Math.sin(a);
    var p = P[id];
    return '<div class="seat filled'+(id===starter?" starter":"")+'" style="left:'+x+'%;top:'+y+'%">'
      + '<div class="av" style="background:'+p.color+';border-color:'+p.color+'">'+initials(p.name)+'</div>'
      + '<div class="nm">'+esc(p.name)+'</div>'
      + (id===starter ? '<div class="badge">STARTS</div>' : '')
      + '</div>';
  }).join("");
  return '<div class="circle">'+seats
    + '<div class="hubtxt">Seating order<br>(clockwise)</div></div>';
}

function viewSeating(sess){
  var draft = ui.draftSeat || (sess.seating ? sess.seating.slice() : []);
  ui.draftSeat = draft;
  var n = Math.max(draft.length, 1);
  var seats = draft.map(function(id, i){
    var a = (-90 + i * (360/n)) * Math.PI/180;
    var x = 50 + 38 * Math.cos(a), y = 50 + 38 * Math.sin(a);
    var p = P[id];
    return '<button class="seat filled" data-act="seat-clear" data-i="'+i+'" style="left:'+x+'%;top:'+y+'%">'
      + '<div class="av" style="background:'+p.color+';border-color:'+p.color+'">'+initials(p.name)+'</div>'
      + '<div class="nm">'+esc(p.name)+'</div></button>';
  }).join("");

  var pool = PLAYERS.map(function(p){
    var on = draft.indexOf(p.id) === -1;
    return '<button class="chip'+(on?"":" off")+'" '+(on?'data-act="seat-add" data-p="'+p.id+'"':"disabled")+'>'
      + dotHTML(p.id) + esc(p.name) + '</button>';
  }).join("");

  var prev = lastSeating(sess);
  return '<h2>Who\'s playing, and where</h2>'
    + '<div class="card" style="padding:14px 12px 16px">'
    + '<div class="circle">'+seats
    + '<div class="hubtxt">'+(draft.length ? "Tap a seat to remove" : "Tap the names below in seating order, going clockwise")+'</div></div>'
    + '<div class="pool" style="margin-top:14px">'+pool+'</div>'
    + '</div>'
    + '<div class="row2" style="margin-top:12px">'
    + (prev ? '<button class="btn ghost" data-act="seat-last">Same as last time</button>' : '')
    + '<button class="btn ghost" data-act="seat-shuffle">Shuffle</button>'
    + '</div>'
    + '<button class="btn primary big" style="margin-top:10px" data-act="seat-save" '+(draft.length>=2?"":"disabled")+'>'
    + (draft.length>=2 ? "Confirm seating ("+draft.length+" playing)" : "Seat at least 2 players") + '</button>';
}
function lastSeating(exclude){
  for(var i=state.sessions.length-1;i>=0;i--){
    var s = state.sessions[i];
    if(s !== exclude && s.seating && s.seating.length >= 2) return s.seating;
  }
  return null;
}

/* ---------- game entry ---------- */
function viewGameEntry(c, sess){
  var ed = ui.editing;
  var g = ed.game;
  var seating = ed.seating;
  var isNew = ed.isNew;

  var rows = seating.map(function(id){
    var e = g.entries[id] || { kind:"points", points:null };
    var isW = e.kind === "win" || e.kind === "cut";
    var p = P[id];
    return '<div class="gp-row'+(isW?" win":"")+'" data-p="'+id+'">'
      + dotHTML(id)
      + '<div class="gp-name">'+esc(p.name)+(id===g.starter?'<span class="st">STARTED</span>':'')+'</div>'
      + '<div class="gp-ctl">'
      + '<button class="wbtn'+(e.kind==="win"?" on":"")+'" data-act="set-win" data-p="'+id+'" data-k="win" aria-label="winner">🏆</button>'
      + '<button class="wbtn cut'+(e.kind==="cut"?" on":"")+'" data-act="set-win" data-p="'+id+'" data-k="cut" aria-label="winner with a cut">✂️</button>'
      + (isW
          ? '<div class="pts locked" style="display:flex;align-items:center;justify-content:center">'+(e.kind==="cut"?"−20":"−10")+'</div>'
          : '<input class="pts tnum" type="text" inputmode="numeric" pattern="[0-9]*" data-pts="'+id+'" value="'+(e.points===null||e.points===undefined?"":e.points)+'" placeholder="0">')
      + '</div></div>';
  }).join("");

  var wid = winnerOf(g);
  return '<h2>'+(isNew ? "Game "+(sess.games.length+1) : "Edit game "+(ed.index+1))+'</h2>'
    + '<div class="card">'
    + '<div class="hdrnote"><span>🏆 WINNER · ✂️ WON ON A CUT</span><span id="gtimer">'+(isNew?"":fmtTime(g.startedAt))+'</span></div>'
    + rows + '</div>'
    + '<div class="note">Seat order, clockwise. Blank counts as 0. '
    + (g.starter ? '<b>'+esc(P[g.starter].name)+'</b> started (last on the leaderboard) — <a href="#" data-act="cycle-starter" style="color:var(--accent)">someone else?</a>' : '') + '</div>'
    + '<button class="btn primary big" style="margin-top:14px" data-act="save-game" '+(wid?"":"disabled")+'>'
    + (wid ? "Save game" : "Tap 🏆 on the winner") + '</button>'
    + '<div class="row2" style="margin-top:10px">'
    + '<button class="btn ghost" data-act="cancel-game">'+(isNew?"Cancel game":"Back")+'</button>'
    + (isNew ? '' : '<button class="btn ghost danger" data-act="delete-game">Delete game</button>')
    + '</div>';
}

function tableHTML(c){
  var shown = c.snaps.slice(-14);
  var head = '<tr><th>After</th>' + c.stats.map(function(s){ return '<th>'+esc(P[s.id].name)+'</th>'; }).join("") + '</tr>';

var chartGeoms = {};

/* Who is in the league at snapshot i (a player joins at their first game). */
function liveAt(c, i){
  return IDS.filter(function(id){ return c.joined[id] !== undefined && i >= c.joined[id]; });
}
/* The group average at each snapshot, over everyone who has joined by then.
   Deliberately independent of which lines are dimmed: hiding a player is a
   way of looking, not a change to the league. */
function averages(c){
  return c.snaps.map(function(sn, i){
    var live = liveAt(c, i);
    if(!live.length) return 0;
    return live.reduce(function(a,id){ return a + sn.totals[id]; }, 0) / live.length;
  });
}
function gapValue(c, means, i, id){ return c.snaps[i].totals[id] - means[i]; }

function drawCharts(c){
  var means = averages(c);
  drawSeries("chartsvg", c, function(i, id){ return c.snaps[i].totals[id]; }, {});
  drawSeries("chartgap", c, function(i, id){ return gapValue(c, means, i, id); },
             { zeroLabel:"average", symmetric:true });
  setScrub(ui.scrub === null || ui.scrub === undefined ? c.snaps.length - 1
                                                       : Math.min(ui.scrub, c.snaps.length - 1), c);
}

function drawSeries(id, c, valueAt, opt){
  var svg = document.getElementById(id);
  if(!svg) return;
  var W = Math.max(260, svg.parentNode.clientWidth), H = 250;
  var pad = { l:38, r:14, t:14, b:26 };
  var snaps = c.snaps, n = snaps.length - 1;

  var from = {};
  IDS.forEach(function(p){ from[p] = c.joined[p] === undefined ? null : c.joined[p]; });
  var vis = IDS.filter(function(p){ return !ui.hidden[p] && from[p] !== null; });
  var series = vis.length ? vis : IDS.filter(function(p){ return from[p] !== null; });

  var lo = Infinity, hi = -Infinity;
  series.forEach(function(p){
    for(var i = from[p]; i <= n; i++){ var v = valueAt(i, p); if(v < lo) lo = v; if(v > hi) hi = v; }
  });
  if(!isFinite(lo)){ lo = 0; hi = 1; }
  if(opt.symmetric){ var m = Math.max(Math.abs(lo), Math.abs(hi)) || 10; lo = -m; hi = m; }
  if(lo === hi){ lo -= 10; hi += 10; }
  var span = hi - lo; lo -= span*0.08; hi += span*0.08;

  var X = function(i){ return pad.l + (n === 0 ? 0 : (i/n) * (W - pad.l - pad.r)); };
  var Y = function(v){ return pad.t + (1 - (v - lo)/(hi - lo)) * (H - pad.t - pad.b); };
  chartGeoms[id] = { X:X, Y:Y, n:n, W:W, H:H, pad:pad, from:from, valueAt:valueAt };

  var grid = niceTicks(lo, hi, 5).map(function(t){
    var y = Y(t);
    return '<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#2a2a26" stroke-width="1"/>'
      + '<text x="'+(pad.l-7)+'" y="'+(y+3.5).toFixed(1)+'" fill="#8a8981" font-size="10" text-anchor="end">'+t+'</text>';
  }).join("");

  var zero = "";
  if(lo < 0 && hi > 0){
    var zy = Y(0).toFixed(1);
    zero = '<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+zy+'" y2="'+zy+'" stroke="#6a6a63" stroke-width="1" stroke-dasharray="3 3"/>'
      /* on the left: the right-hand edge is where the lines end */
      + (opt.zeroLabel ? '<text x="'+(pad.l+5)+'" y="'+(Y(0)-5).toFixed(1)+'" fill="#8a8981" font-size="10">'+opt.zeroLabel+'</text>' : "");
  }

  var lines = IDS.map(function(p){
    if(from[p] === null) return "";
    var d = [];
    for(var i = from[p]; i <= n; i++) d.push((d.length?"L":"M") + X(i).toFixed(1) + " " + Y(valueAt(i,p)).toFixed(1));
    return '<path d="'+d.join(" ")+'" fill="none" stroke="'+P[p].color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="'+(ui.hidden[p]?0.1:1)+'"/>';
  }).join("");

  var xlab = '<text x="'+pad.l+'" y="'+(H-7)+'" fill="#8a8981" font-size="10">start</text>'
    + '<text x="'+(W-pad.r)+'" y="'+(H-7)+'" fill="#8a8981" font-size="10" text-anchor="end">game '+n+'</text>';

  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("height", H);
  svg.innerHTML = grid + zero + lines + xlab + '<g class="cross"></g>';
}

function niceTicks(lo, hi, count){
  var raw = (hi - lo) / count;
  var mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
  var norm = raw / mag;
  var step = (norm > 7 ? 10 : norm > 3 ? 5 : norm > 1.5 ? 2 : 1) * mag;
  var out = [], t = Math.ceil(lo/step)*step;
  for(; t <= hi && out.length < 9; t += step) out.push(Math.round(t));
  return out;
}

function setScrub(i, c){
  c = c || compute();
  ui.scrub = i;
  var sn = c.snaps[i];
  if(!sn) return;
  var means = averages(c);

  Object.keys(chartGeoms).forEach(function(key){
    var g = chartGeoms[key], svg = document.getElementById(key);
    if(!g || !svg) return;
    var cross = svg.querySelector(".cross");
    if(!cross) return;
    var x = g.X(i);
    var marks = IDS.filter(function(id){
      return !ui.hidden[id] && g.from[id] !== null && i >= g.from[id];
    }).map(function(id){
      return '<circle cx="'+x.toFixed(1)+'" cy="'+g.Y(g.valueAt(i,id)).toFixed(1)+'" r="4" fill="'+P[id].color+'" stroke="#1a1a19" stroke-width="2"/>';
    }).join("");
    cross.innerHTML = '<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+g.pad.t+'" y2="'+(g.H-g.pad.b)+'" stroke="#5a5a54" stroke-width="1"/>' + marks;
  });

  var live = liveAt(c, i);
  var ranked = (live.length ? live : IDS).slice().sort(function(a,b){ return sn.totals[a]-sn.totals[b]; });
  var el = document.getElementById("scrub");
  if(el){
    el.innerHTML = '<div class="hd">'+sn.label+(sn.at?' \u00b7 '+fmtTime(sn.at):'')+'</div>'
      + ranked.map(function(id, k){
          var gap = Math.round(sn.totals[id] - means[i]);
          return '<div class="r"'+(ui.hidden[id]?' style="opacity:.35"':'')+'>'
            + '<span class="muted tnum" style="width:14px">'+(k+1)+'</span>'
            + dotHTML(id) + esc(P[id].name)
            + '<b>'+sn.totals[id]+'</b>'
            + '<span class="gap tnum">'+(gap > 0 ? "+" : gap < 0 ? "\u2212" : "")+Math.abs(gap)+'</span>'
            + '</div>';
        }).join("")
      + '<div class="note" style="margin-top:7px">total \u00b7 how far from the average</div>';
  }
}

/* ============================ CSV ============================ */
function toCSV(c){
  var head = ["session","session_start","game_no","game_in_session","game_start","game_end","game_seconds",
    "player","seat","starter","players_at_table","left_neighbour","right_neighbour",
    "result","raw_points","bonus","net_change","total_after","game_average"];
  var lines = [head.join(",")];
  var running = {}; IDS.forEach(function(id){ running[id] = (state.opening && state.opening[id]) || 0; });

  c.flat.forEach(function(f){
    var g = f.game, seating = f.sess.seating || IDS;
    IDS.forEach(function(id){
      var e = g.entries[id]; if(!e) return;
      var n = seating.length;
      var seat = seating.indexOf(id);
      var left = seat >= 0 ? seating[(seat+n-1)%n] : "";
      var right = seat >= 0 ? seating[(seat+1)%n] : "";
      var base = e.kind === "win" ? -10 : e.kind === "cut" ? -20 : (e.points||0);
      var mid = running[id] + base, bonus = 0;
      if(mid > 0 && mid % 200 === 0) bonus += -200;
      if(mid === P[id].born) bonus += P[id].yearBonus;
      running[id] = mid + bonus;
      lines.push([
        f.si+1, iso(f.sess.startedAt), f.no, f.gi+1, iso(g.startedAt), iso(g.endedAt),
        (g.startedAt && g.endedAt) ? Math.round((g.endedAt-g.startedAt)/1000) : "",
        P[id].name, seat >= 0 ? seat+1 : "",
        g.starter ? (g.starter === id ? "yes" : "no") : "",
        seating.length,
        left ? P[left].name : "", right ? P[right].name : "",
        e.kind, base, bonus, base + bonus, running[id], fmtAvg(gameAverage(g))
      ].join(","));
    });
  });
  return lines.join("\n");
}
function iso(ts){ return ts ? new Date(ts).toISOString() : ""; }
function download(name, text, type){
  var blob = new Blob([text], { type: type });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

/* ============================ imported history ============================ */
/* The first 101 games came from the spreadsheet we kept by hand. Loading is
   idempotent: it replaces any previously imported sessions rather than
   stacking a second copy on top. */
function loadHistory(){
  if(!window.UNO_HISTORY) return false;
  var h = JSON.parse(JSON.stringify(window.UNO_HISTORY));
  state.opening = h.opening || {};
  h.sessions.forEach(function(sess, si){
    sess.ord = si + 1; sess.updatedAt = HISTORY_STAMP;
    sess.games.forEach(function(g, gi){
      g.ord = (si + 1) * 1000 + gi; g.updatedAt = HISTORY_STAMP;
    });
  });
  h.sessions.forEach(function(sess){
    delete state.tombs[sess.id];
    sess.games.forEach(function(g){ delete state.tombs[g.id]; });
  });
  state.sessions = h.sessions.concat(state.sessions.filter(function(s){ return !s.imported; }));
  state.seeded = true;
  save();
  return true;
}
function seedOnFirstRun(){
  if(state.seeded || state.sessions.length) { state.seeded = true; return; }
  loadHistory();
}

/* ============================ actions ============================ */
document.addEventListener("click", function(ev){
  var tab = ev.target.closest("[data-tab]");
  if(tab){ ui.tab = tab.dataset.tab; ui.editing = null; ui.openSession = null; render(); return; }
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var act = el.dataset.act;
  ev.preventDefault();
  var sess = curSession();

  if(act === "new-session"){
    state.sessions.push({ id:uid(), ord:Date.now(), startedAt:Date.now(), endedAt:null, seating:null, games:[], live:false });
    ui.draftSeat = lastSeating(null) ? lastSeating(null).slice() : [];
    save(); render(); return;
  }
  if(act === "seat-add"){
    if(ui.draftSeat.indexOf(el.dataset.p) === -1) ui.draftSeat.push(el.dataset.p);
    render(); return;
  }
  if(act === "seat-clear"){ ui.draftSeat.splice(+el.dataset.i, 1); render(); return; }
  if(act === "seat-last"){ var ls = lastSeating(sess); if(ls){ ui.draftSeat = ls.slice(); render(); } return; }
  if(act === "seat-shuffle"){
    var a = (ui.draftSeat && ui.draftSeat.length >= 2) ? ui.draftSeat.slice() : IDS.slice();
    for(var k=a.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    ui.draftSeat = a; render(); return;
  }
  if(act === "seat-save"){
    if(!sess || ui.draftSeat.length < 2) return;
    sess.seating = ui.draftSeat.slice();
    ui.draftSeat = null; save(); render(); return;
  }
  if(act === "reseat"){ ui.draftSeat = sess.seating.slice(); sess.seating = null; save(); render(); return; }
  if(act === "end-session"){
    if(!confirm("End this session? The leaderboard keeps everything.")) return;
    sess.endedAt = Date.now(); sess.live = false; save(); render(); return;
  }

  if(act === "start-game" || act === "open-live"){
    var c = compute();
    if(act === "start-game"){
      sess.live = { id:uid(), ord:Date.now(), startedAt:Date.now(), endedAt:null,
        starter:suggestStarter(sess.seating, c.totals), entries:{} };
      save();
    }
    ui.editing = { game:sess.live, seating:sess.seating, isNew:true };
    ui.tab = "session"; render(); return;
  }
  if(act === "open-session"){ ui.openSession = el.dataset.s; ui.tab = "session"; render(); return; }
  if(act === "close-session"){ ui.openSession = null; render(); return; }
  if(act === "delete-session"){
    var target = sessionById(ui.openSession);
    if(!target) return;
    if(!confirm("Delete this whole session and its " + plural(target.games.length,"game")
      + "? Everyone's totals are recalculated, on every phone.")) return;
    var now = Date.now();
    target.games.forEach(function(g){ state.tombs[g.id] = { kind:"game", at:now }; });
    state.tombs[target.id] = { kind:"session", at:now };
    state.sessions.splice(state.sessions.indexOf(target), 1);
    ui.openSession = null; ui.editing = null;
    save(); render();
    toast("Session deleted");
    return;
  }
  if(act === "edit-game"){
    var host = ui.openSession ? sessionById(ui.openSession) : sess;
    if(!host) return;
    var gid = el.dataset.g;
    var idx = host.games.findIndex(function(g){ return g.id === gid; });
    if(idx < 0) return;
    ui.editing = { game:JSON.parse(JSON.stringify(host.games[idx])), seating:host.seating,
                   isNew:false, index:idx, sessionId:host.id };
    render(); return;
  }
  if(act === "set-win"){
    var g = ui.editing.game, pid = el.dataset.p, kind = el.dataset.k;
    readInputs();
    var cur = g.entries[pid];
    if(cur && cur.kind === kind){ g.entries[pid] = { kind:"points", points:null }; }
    else {
      IDS.forEach(function(id){
        var e = g.entries[id];
        if(e && (e.kind === "win" || e.kind === "cut")) g.entries[id] = { kind:"points", points:null };
      });
      g.entries[pid] = { kind:kind, points:null };
    }
    render(); return;
  }
  if(act === "cycle-starter"){
    var g2 = ui.editing.game, seat = ui.editing.seating;
    var at = seat.indexOf(g2.starter);
    g2.starter = seat[(at+1) % seat.length];
    readInputs(); render(); return;
  }
  if(act === "save-game"){ saveGame(); return; }
  if(act === "cancel-game"){
    if(ui.editing.isNew && sess){
      if(!confirm("Throw away this game?")) return;
      sess.live = false; save();
    }
    ui.editing = null; render(); return;
  }
  if(act === "delete-game"){
    if(!confirm("Delete this game? Everyone's totals are recalculated.")) return;
    var owner = editSession(); if(!owner) return;
    var gone = owner.games.splice(ui.editing.index, 1)[0];
    state.tombs[gone.id] = { kind:"game", at:Date.now() };
    ui.editing = null; save(); render(); toast("Game deleted"); return;
  }

  if(act === "toggle-series"){
    var p = el.dataset.p; ui.hidden[p] = !ui.hidden[p]; render(); return;
  }
  if(act === "go-sync"){ ui.tab = "data"; ui.openSession = null; render(); return; }
  if(act === "sync-save"){
    var raw = document.getElementById("syncurl").value;
    var v = Sync.normalise(raw);
    if(v && !Sync.looksValid(v)){ toast("That doesn't look like a web address"); return; }
    Sync.setUrl(v); render();
    toast(v ? "Connecting to the shared league…" : "Sharing turned off");
    return;
  }
  if(act === "sync-invite"){
    var link = location.origin + location.pathname + "?league=" + encodeURIComponent(Sync.url);
    var done = function(){ toast("Invite link copied — send it to everyone"); };
    if(navigator.clipboard) navigator.clipboard.writeText(link).then(done, function(){ prompt("Copy this link:", link); });
    else prompt("Copy this link:", link);
    return;
  }
  if(act === "sync-off"){
    if(!confirm("Stop sharing with the others? This phone keeps everything it already has.")) return;
    Sync.setUrl(""); render(); return;
  }
  if(act === "export-csv"){ download("uno-roadtrip.csv", toCSV(compute()), "text/csv"); toast("CSV saved"); return; }
  if(act === "export-json"){ download("uno-backup.json", JSON.stringify(state, null, 2), "application/json"); toast("Backup saved"); return; }
  if(act === "reimport"){
    if(!confirm("Reload the games from the spreadsheet? Anything you've entered in the app is kept.")) return;
    loadHistory(); render(); toast("Spreadsheet history reloaded"); return;
  }
  if(act === "wipe"){
    if(!confirm("Erase every session and game? This cannot be undone.")) return;
    if(!confirm("Really sure? Export a backup first if you might want it.")) return;
    state = blank(); ui.editing = null; save(); render(); toast("All data erased"); return;
  }
});

function readInputs(){
  if(!ui.editing) return;
  document.querySelectorAll("[data-pts]").forEach(function(inp){
    var id = inp.dataset.pts;
    var raw = inp.value.replace(/[^0-9]/g, "");
    var e = ui.editing.game.entries[id];
    if(e && (e.kind === "win" || e.kind === "cut")) return;
    ui.editing.game.entries[id] = { kind:"points", points: raw === "" ? null : parseInt(raw, 10) };
  });
}

function saveGame(){
  readInputs();
  var ed = ui.editing, g = ed.game, sess = editSession();
  var wid = winnerOf(g);
  if(!wid){ toast("Tap 🏆 next to whoever went out"); return; }
  ed.seating.forEach(function(id){ if(!g.entries[id]) g.entries[id] = { kind:"points", points:0 }; });

  var before = compute().totals;
  if(ed.isNew){
    g.endedAt = Date.now();
    sess.games.push(g);
    sess.live = false;
  } else {
    sess.games[ed.index] = g;
  }
  ui.editing = null;
  save();

  var c = compute();
  var avg = "average " + fmtAvg(gameAverage(g));
  var msg = null;
  if(ed.isNew){
    var f = c.flat[c.flat.length-1];
    if(f && f.bonuses.length){
      msg = f.bonuses.map(function(b){
        return "🎉 " + P[b.id].name + " landed exactly on " + b.landed + " → " + b.bonus + "!";
      }).join("  ") + "  ·  " + avg;
    }
  }
  render();
  if(msg) toast(msg, "bonus");
  else toast(ed.isNew ? (P[wid].name + " wins game " + c.flat.length + "  ·  " + avg)
                      : ("Game updated  ·  " + avg));
  if(pendingUpdate){ pendingUpdate = false; setTimeout(function(){ location.reload(); }, 1200); }
}

/* keep typed values while re-rendering on blur */
document.addEventListener("change", function(ev){
  if(ev.target.dataset && ev.target.dataset.pts) readInputs();
});

/* live timer */
function tickTimer(){
  var sess = curSession();
  var el = document.getElementById("livetimer");
  var gt = document.getElementById("gtimer");
  if(sess && sess.live){
    var d = dur(Date.now() - sess.live.startedAt);
    if(el) el.textContent = d;
    if(gt && ui.editing && ui.editing.isNew) gt.textContent = d + " ELAPSED";
  }
}
setInterval(tickTimer, 1000);

/* chart scrubbing */
document.addEventListener("pointerdown", startScrub);
function startScrub(ev){
  var svg = ev.target.closest("#chartsvg, #chartgap");
  var g = svg && chartGeoms[svg.id];
  if(!g) return;
  /* dragging either chart moves the crosshair on both */
  var move = function(e){
    var r = svg.getBoundingClientRect();
    var px = (e.clientX - r.left) * (g.W / r.width);
    var t = (px - g.pad.l) / (g.W - g.pad.l - g.pad.r);
    var i = Math.round(Math.max(0, Math.min(1, t)) * g.n);
    setScrub(i);
  };
  move(ev);
  var up = function(){
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

window.addEventListener("resize", function(){ if(ui.tab === "chart") render(); });

seedOnFirstRun();
Sync.init();

/* recover a session that was mid-game when the phone was closed */
(function(){
  var s = curSession();
  if(s && s.live && s.seating) ui.tab = "session";
})();

render();

/* When a new version of the app is published, the old cached copy is what
   opens. Reload once as soon as the new one takes over — but never in the
   middle of typing a game in, or the scores on screen would be lost. */
var pendingUpdate = false;
function onNewVersion(){
  if(ui.editing){ pendingUpdate = true; toast("Update ready — it'll apply after you save"); return false; }
  location.reload();
  return true;
}
if("serviceWorker" in navigator){
  var reloading = false;
  /* On a first-ever visit the worker claims this page for the first time —
     that is an install, not an update, and must not trigger a reload. */
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!hadController || reloading) return;
    reloading = onNewVersion();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
